<ion-header><ion-toolbar><ion-buttons slot="start"><ion-button aria-label="Go back" (click)="goBackToStore()"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button></ion-buttons><ion-title>Favourites</ion-title></ion-toolbar></ion-header>
<ion-content><main class="app-page"><div *ngIf="favoriteProducts.length === 0" class="app-empty-state app-card"><ion-icon name="heart-outline"></ion-icon><h2>No favourites yet</h2><p>Save listings you want to revisit later.</p></div><section class="product-grid" *ngIf="favoriteProducts.length > 0"><article *ngFor="let product of favoriteProducts" class="product-card app-card"><button class="remove-button" type="button" aria-label="Remove from favourites" (click)="removeFromFavorites(product.id)"><ion-icon name="close-outline"></ion-icon></button><img [src]="product.image" [alt]="product.name" loading="lazy" /><div><h2>{{ product.name }}</h2><strong>{{ product.price | currency: 'INR':'symbol':'1.0-0' }}</strong></div></article></section></main></ion-content>
