<ion-content><main class="auction-page app-page"><section class="app-page-header"><div><h1>Live auctions</h1><p>Bid before time runs out and track your best opportunities.</p></div></section><section class="auction-grid">@for (auction of auctions; track auction.id) {<article class="auction-card app-card"><div class="auction-media"><img [src]="auction.image" [alt]="auction.title" loading="lazy" /><span><ion-icon name="radio-button-on-outline"></ion-icon> Live</span></div><div class="auction-copy"><h2>{{ auction.title }}</h2><dl><div><dt>Current bid</dt><dd>{{ auction.currentBid | currency: 'INR':'symbol':'1.0-0' }}</dd></div><div><dt>Ends on</dt><dd>{{ auction.endTime }}</dd></div></dl><ion-button expand="block" (click)="bid(auction.id)">Place a bid</ion-button></div></article>}</section></main></ion-content>
